[project]
name = "agentframe"
version = "0.1.0"
description = "OOP-native Python agents — state is fields, tools are methods, prompts are docstrings, contracts are types, actions are code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Khandelwal" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.1",
]
mcp = []

[project.urls]
Homepage = "https://github.com/nvmaditya/agentframe"
Repository = "https://github.com/nvmaditya/agentframe"
Issues = "https://github.com/nvmaditya/agentframe/issues"
Documentation = "https://github.com/nvmaditya/agentframe/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "capability: interface-capability suite (scripted in CI; live models opt-in)",
    "adversarial: sandbox security cases",
]

[tool.coverage.run]
branch = true
source_pkgs = ["agentframe"]
relative_files = true

[tool.coverage.paths]
source = [
    "src/agentframe",
    "*/site-packages/agentframe",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_package = "agentframe"

[[tool.importlinter.contracts]]
name = "core is standalone"
type = "independence"
modules = ["agentframe.core"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "contracts is standalone"
type = "independence"
modules = ["agentframe.contracts"]

[[tool.importlinter.contracts]]
name = "history is standalone"
type = "independence"
modules = ["agentframe.history"]

[[tool.importlinter.contracts]]
name = "sandbox is standalone"
type = "independence"
modules = ["agentframe.sandbox"]

[[tool.importlinter.contracts]]
name = "runtime does not import concrete adapters"
type = "forbidden"
source_modules = ["agentframe.runtime.loop"]
forbidden_modules = [
    "agentframe.sandbox.inprocess",
    "agentframe.history.memory",
    "agentframe.runtime.openai",
    "agentframe.mcp.stdio",
    "agentframe.mcp.http",
    "agentframe.mcp.fake",
]

[[tool.importlinter.contracts]]
name = "core and runtime do not import mcp"
type = "forbidden"
source_modules = [
    "agentframe.core",
    "agentframe.runtime",
]
forbidden_modules = [
    "agentframe.mcp",
]
