name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra dev
      - name: Tests
        run: uv run pytest --cov --cov-fail-under=90
      - name: Import contracts
        run: uv run lint-imports

  core-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Core and contracts without touching adapters
        run: uv run pytest tests/core tests/contracts -q
      - name: Import contracts
        run: uv run lint-imports
