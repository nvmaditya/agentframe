name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv sync --extra dev
          uv pip install -e .
      - name: Prove we import src/
        run: |
          uv run python -c "import agentframe, pathlib; p=pathlib.Path(agentframe.__file__).resolve(); print(p); assert 'src' in p.parts, p"
      - name: Tests
        run: uv run pytest --cov=src/agentframe --cov-report=term-missing --cov-fail-under=90
      - name: Import contracts
        run: uv run lint-imports

  core-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv sync --extra dev
          uv pip install -e .
      - name: Core and contracts without touching adapters
        run: uv run pytest tests/core tests/contracts -q
      - name: Import contracts
        run: uv run lint-imports
